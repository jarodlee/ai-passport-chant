<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;padding:24px;background:var(--panel-bg,#f7f7f5);color:var(--text-primary,#1a1a1a);line-height:1.7}main{max-width:640px;margin:auto}article{padding:20px;border:1px solid var(--border-default,#ddd);border-radius:14px;margin:18px 0}button{font:inherit;padding:9px 20px;margin:4px;border:1px solid var(--border-default,#ddd);border-radius:9px;background:var(--surface,#eee);color:inherit;cursor:pointer}#state{font-weight:650}small{opacity:.75}::-webkit-scrollbar{width:12px}::-webkit-scrollbar-thumb{border:3px solid transparent;background:transparent;background-clip:padding-box;border-radius:8px}.is-scrolling::-webkit-scrollbar-thumb{background-color:var(--msg-scrollbar,#aaa)}</style><main><p id="state">正在连接本机语音服务…</p><article>在设备主页进入「Cindy对话」<br>按住确定，看到「正在录音」后说话，松开发送。<p>每次最长8秒，回复自动播报，结束后佛音继续播放。上键返回。</p><small>设备和Mac需在同一局域网，Mac保持唤醒并运行Cindy。语音在本机识别与合成，问题通过独立的「AI Passport 语音对话」任务回答，可在任务列表查看记录。</small></article><p id="detail"></p><button data-method="start">启动服务</button><button data-method="stop">停止服务</button><button data-method="status">刷新状态</button><p><small>设备已与这份桥接配对，无需手填地址。若未找到桥接，请检查Wi-Fi、路由器设备隔离与Mac防火墙。停止服务也会取消正在处理的语音。</small></p></main><script src="/panel.js"></script></html>
